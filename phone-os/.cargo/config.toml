[build]
target = "aarch64-unknown-none-softfloat"

[target.aarch64-unknown-none-softfloat]
rustflags = [
  "-C", "link-arg=-nostdlib",
  "-C", "relocation-model=static",
  "-C", "code-model=small",
  "-C", "link-arg=-Tlink.ld",
]

# Real hardware targets with device-specific configurations
[target.'cfg(feature = "real_hardware")']
rustflags = [
  "-C", "link-arg=-nostdlib",
  "-C", "relocation-model=static", 
  "-C", "code-model=small",
  "-C", "link-arg=-Tlink.ld",
]

[target.'cfg(feature = "pixel_6")']
rustflags = [
  "-C", "link-arg=-nostdlib",
  "-C", "relocation-model=static",
  "-C", "code-model=small",
  "-C", "link-arg=-Tlink.ld",
]

[target.'cfg(feature = "pinephone")']
rustflags = [
  "-C", "link-arg=-nostdlib",
  "-C", "relocation-model=static",
  "-C", "code-model=small",
  "-C", "link-arg=-Tlink.ld",
]

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
